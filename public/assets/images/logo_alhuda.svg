<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <g transform="translate(100, 85)">
    <!-- Outer 5-pointed star curved shape -->
    <path d="M 0,-78 
             C 14,-38 38,-38 74,-24 
             C 44,4 34,34 46,70 
             C 20,44 -20,44 -46,70 
             C -34,34 -44,4 -74,-24 
             C -38,-38 -14,-38 0,-78 Z" 
          fill="#22c55e"/>
    
    <!-- Inner star shape -->
    <path d="M 0,-60 
             C 10,-30 30,-30 56,-18 
             C 33,4 25,25 35,52 
             C 15,33 -15,33 -35,52 
             C -25,25 -33,4 -56,-18 
             C -30,-30 -10,-30 0,-60 Z" 
          fill="#15803d"/>
    
    <!-- Inner white AH monogram -->
    <text x="0" y="7" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-style="italic" letter-spacing="-1">AH</text>
  </g>
  
  <!-- Text RS AL HUDA at bottom -->
  <text x="100" y="195" font-family="'Impact', 'Segoe UI Black', Arial, sans-serif" font-weight="900" font-size="24" fill="#16a34a" text-anchor="middle" letter-spacing="1.5">RS AL HUDA</text>
</svg>
